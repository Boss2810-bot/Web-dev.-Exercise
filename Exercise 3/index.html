<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS card desingn</title>
    <style>
        *{
            padding: 0;
            margin: 0;
        }
        body {
            background-color: gray;
            padding: 40px;
        }

        .card {
            background-color: rgb(89, 116, 151);
            height: 320px;
            width: 198px;
            border-radius: 7px;
        }

        .image {
            padding: 5px;
        }

        .image img {
            border-radius: 7px;
        }
        .content{
            padding: 3px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .content p{
            font-size: 10px;
            color: rgb(108, 60, 60);
        }
        .capsule span{
            border: 1px solid rgb(63, 50, 50);
            padding: 1px;
            border-radius: 7px;
            font-size: 10px;
        }
        .capsule{
            padding: 0 37px;
        }
        .button{
            text-align: center;
        }
        .button button{
            border-radius: 3px;
            padding:0  2px;
            background-color: rgb(121, 121, 146);
            color: blue;
            font-size: 12px;
        }
    </style>
</head>

<body>
    <div class="card">
        <div class="image">
            <img width="188PX"
                src="https://images.pexels.com/photos/206359/pexels-photo-206359.jpeg?auto=compress&cs=tinysrgb&w=600"
                alt="LAKE SCENNERY">
        </div>
<div class="capsule">
    <span>Nature</span>
    <span>Lake</span>
</div>
<div class="content">
    <h2>DHRUV</h2>
    <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Ducimus aliquam velit vitae saepe consectetur ipsum a quisquam aspernatur ad dolores in consequuntur, voluptates ipsam earum explicabo odio reiciendis exercitationem officiis eius, quasi alias quibusdam.</p>
</div>
<div class="button">
    <button>SUBMIT</button>
</div>
    </div>
</body>

</html>
